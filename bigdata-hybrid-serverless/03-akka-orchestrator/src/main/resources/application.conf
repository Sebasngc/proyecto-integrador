# =============================================================================
#  Configuración del orquestador.
#  Todo valor sensible o dependiente del entorno se lee de variables de entorno
#  con un valor por defecto apto para la demo local.
# =============================================================================

orchestrator {

  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8081
    port = ${?HTTP_PORT}
  }

  # Servicio serverless de preprocesamiento GPU
  gpu {
    endpoint = "http://gpu-preprocess:8080/2015-03-31/functions/function/invocations"
    endpoint    = ${?GPU_ENDPOINT}
    timeout     = 120s          # el kernel es rápido; lo lento es leer de S3
    max-retries = 3
  }

  # Lanzador de jobs Spark (Lambda -> EMR Serverless, o servicio local)
  spark {
    launcher-endpoint = "http://localhost:8082"
    launcher-endpoint = ${?SPARK_LAUNCHER_ENDPOINT}
    poll-interval     = 10s
    max-polls         = 180     # 180 * 10s = 30 min de techo por job
    timeout           = 60s
    max-retries       = 2       # relanzar un job Spark es caro: pocos intentos
  }

  job {
    max-attempts     = 3        # reintentos de ETAPA (los de red van aparte)
    retry-base-delay = 2s
    stage-timeout    = 35m      # cota superior de una etapa completa
  }

  repository {
    type  = "memory"            # memory | dynamodb
    type  = ${?REPOSITORY_TYPE}
    table = "bigdata-jobs"
    table = ${?JOBS_TABLE}
  }
}

akka {
  loglevel = "INFO"
  loglevel = ${?LOG_LEVEL}
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  actor {
    # Serialización explícita: sin esto, Akka usaría Java serialization, que es
    # lenta e insegura (deserializar datos no confiables permite RCE).
    serialization-bindings {
      "com.bigdata.orchestrator.protocol.JsonSerializable" = jackson-cbor
    }

    # Dispatcher dedicado a las llamadas HTTP salientes. Aislar estas tareas del
    # dispatcher por defecto evita que una tormenta de reintentos hacia el
    # servicio GPU deje sin hilos al resto del sistema (bulkhead pattern).
    io-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 2.0
        parallelism-max = 32
      }
      throughput = 1
    }
  }

  persistence {
    # --- perfil local: journal en memoria, se pierde al reiniciar ---
    journal.plugin = "akka.persistence.journal.inmem"
    journal.plugin = ${?JOURNAL_PLUGIN}
    snapshot-store.plugin = "akka.persistence.snapshot-store.local"
    snapshot-store.local.dir = "target/snapshots"

    # --- perfil producción: JDBC (Postgres/Aurora Serverless v2) ---
    # journal.plugin = "jdbc-journal"
    # snapshot-store.plugin = "jdbc-snapshot-store"
  }

  http {
    server {
      request-timeout = 30s
      idle-timeout    = 60s
      # No revelar la versión de Akka HTTP en la cabecera Server.
      server-header = "bigdata-orchestrator"
    }
    client.connecting-timeout = 10s
    host-connection-pool {
      max-connections   = 32
      max-open-requests = 128   # potencia de 2 obligatoria
      max-retries       = 0     # los reintentos los gestiona RetrySupport,
                                # no la capa de transporte (evita duplicarlos)
    }
  }

  coordinated-shutdown {
    exit-jvm = on
    default-phase-timeout = 10s
  }
}
